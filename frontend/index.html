<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Agent AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login View -->
    <div id="login-view" class="view active">
        <div class="login-container glass-card">
            <div class="login-header">
                <div class="logo">
                    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                        <polyline points="2 17 12 22 22 17"></polyline>
                        <polyline points="2 12 12 17 22 12"></polyline>
                    </svg>
                    <h1>Agentio</h1>
                </div>
                <p>Enterprise Financial Intelligence</p>
            </div>

            <div class="demo-accounts">
                <p class="demo-title">Demo Accounts</p>
                <div class="demo-cards">
                    <div class="demo-card" onclick="app.quickLogin('ceo')">
                        <div class="demo-role badge-gold">CEO</div>
                        <div class="demo-info">
                            <div class="demo-name">CEO_Name</div>
                            <div class="demo-creds">ceo@apple.com / ceo123</div>
                        </div>
                        <div class="demo-access">Full Access</div>
                    </div>
                    <div class="demo-card" onclick="app.quickLogin('cto')">
                        <div class="demo-role badge-blue">CTO</div>
                        <div class="demo-info">
                            <div class="demo-name">CTO_Name</div>
                            <div class="demo-creds">cto@apple.com / cto123</div>
                        </div>
                        <div class="demo-access">No HC/Comp</div>
                    </div>
                    <div class="demo-card" onclick="app.quickLogin('cfo')">
                        <div class="demo-role badge-green">CFO</div>
                        <div class="demo-info">
                            <div class="demo-name">CFO_Name</div>
                            <div class="demo-creds">cfo@apple.com / cfo123</div>
                        </div>
                        <div class="demo-access">No Strategy/R&D</div>
                    </div>
                </div>
            </div>

            <form id="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <div id="login-error" class="error-message"></div>
                <button type="submit" class="btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Chat View -->
    <div id="chat-view" class="view">
        <header class="chat-header glass-card">
            <div class="logo small">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span>Agentio</span>
            </div>
            
            <div class="user-info">
                <div class="user-details">
                    <span id="user-name" class="user-name"></span>
                    <span id="user-role-badge" class="role-badge"></span>
                </div>
                <div id="access-level" class="access-level"></div>
                <button id="logout-btn" class="btn-secondary small">Logout</button>
            </div>
        </header>

        <main class="chat-main">
            <div id="chat-messages" class="chat-messages">
                <div class="message agent-message welcome-message">
                    <div class="message-content">
                        Welcome to Agentio Financial Intelligence. How can I assist you today?
                    </div>
                </div>
            </div>
            
            <div id="typing-indicator" class="typing-indicator hidden">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>

        <footer class="chat-footer">
            <form id="chat-form" class="glass-card">
                <input type="text" id="chat-input" placeholder="Ask about financial performance, headcount, or strategy..." autocomplete="off">
                <button type="submit" class="btn-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <!-- Templates -->
    <template id="message-template">
        <div class="message">
            <div class="message-content markdown-body"></div>
            <div class="message-meta">
                <div class="access-note hidden"></div>
                <div class="sources-section hidden">
                    <button class="sources-toggle">View Sources</button>
                    <div class="sources-list hidden"></div>
                </div>
                <div class="feedback-section hidden">
                    <button class="btn-feedback upvote" title="Helpful">👍</button>
                    <button class="btn-feedback downvote" title="Not helpful">👎</button>
                </div>
            </div>
            <div class="correction-form hidden glass-card">
                <h4>Provide Correction</h4>
                <textarea placeholder="What should the answer be?" class="correction-input"></textarea>
                <div class="correction-actions">
                    <button class="btn-secondary small cancel-correction">Cancel</button>
                    <button class="btn-primary small submit-correction">Submit</button>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
